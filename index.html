<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>電子書架</title>
<!-- iPad「加入主畫面」後，從主畫面圖示開啟就是沒有 Safari 網址列的全螢幕 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="電子書架">
<meta name="theme-color" content="#f1f1ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#f1f1ef;--fg:#1b1b1b;--muted:rgba(0,0,0,.6);--btn:rgba(0,0,0,.08);--btn-on:rgba(0,0,0,.18);--accent:#f08a3c;--flip:1100ms}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    background:var(--bg);touch-action:manipulation}
  body.idle{cursor:none}
  body.kiosk,body.kiosk *{cursor:none!important}
  html.kiosk{touch-action:none;overscroll-behavior:none}
  button{font:inherit;color:var(--fg);background:var(--btn);border:0;border-radius:999px;min-width:56px;height:48px;padding:0 20px;font-size:18px;white-space:nowrap;flex:0 0 auto}
  button:active{background:var(--btn-on)}

  /* ================= 書架 ================= */
  #shelfView{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;
    padding:clamp(16px,3vh,40px) 24px;-webkit-overflow-scrolling:touch}
  #shelfView h1{font-size:clamp(30px,4.2vw,56px);letter-spacing:.08em;text-align:center}
  .sub{margin-top:10px;font-size:clamp(16px,1.8vw,24px);color:var(--muted);text-align:center}
  /* 空白背景：書平放在畫面上，書名貼在下方 */
  #books{--w:240px;margin-top:clamp(20px,3vh,40px);width:min(100%,1600px);display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:48px 56px}
  .item{width:var(--w);min-width:176px;display:block;color:inherit;text-decoration:none;outline:none;cursor:pointer;text-align:center;transition:transform .25s}
  .item:hover,.item:focus-visible{transform:translateY(-6px)}
  .cover{position:relative;aspect-ratio:.708;border-radius:3px 8px 8px 3px;overflow:hidden;background:#fff;
    box-shadow:0 14px 24px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.35)}
  .cover img{width:100%;height:100%;object-fit:fill;display:block}
  .cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;
    background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.14) 55%,transparent);z-index:1}
  .item .name{margin:18px -10px 0;white-space:normal;line-height:1.25}
  .name{font-size:clamp(22px,2.2vw,34px);font-weight:700;line-height:1.3}
  .desc{margin-top:6px;font-size:clamp(13px,1.3vw,18px);color:var(--muted)}
  .pages{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;background:rgba(240,138,60,.28);font-size:clamp(13px,1.2vw,17px)}
  .go{display:block;margin:12px auto 0;padding:13px 38px;width:max-content;border-radius:999px;background:var(--accent);color:#1b1208;font-weight:800;font-size:clamp(20px,1.9vw,28px)}
  .play{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.55);z-index:2}
  .play::after{content:"";position:absolute;left:38%;top:26%;border-style:solid;border-width:24% 0 24% 38%;border-width:calc(var(--w) * .075) 0 calc(var(--w) * .075) calc(var(--w) * .12);border-color:transparent transparent transparent #fff}
  #videoView{position:fixed;inset:0;display:none;background:#000;z-index:5}
  #videoView video{position:absolute;inset:0;width:100%;height:100%;background:#000;outline:none}
  #vback{position:absolute;left:16px;top:calc(16px + env(safe-area-inset-top));z-index:6;height:48px;padding:0 22px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:20px;font-weight:600;white-space:nowrap;cursor:pointer}
  @media (max-aspect-ratio: 5/4) and (min-width: 1400px){ #vback{height:76px;padding:0 34px;font-size:30px} }
  #sfull{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:2}
  .tip{margin-top:auto;padding-top:40px;color:rgba(0,0,0,.45);font-size:15px;text-align:center}

  /* ================= 閱讀器（翻書） ================= */
  #reader{display:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #book{flex:none;position:relative;perspective:3200px;transition:transform var(--flip) cubic-bezier(.45,.05,.25,1)}
  .slot,.leaf{position:absolute;top:0;height:100%;width:50%}
  .slot{background:#fff;overflow:hidden}
  #L{left:0;border-radius:6px 0 0 6px}
  #R{left:50%;border-radius:0 6px 6px 0}
  .slot img,.face img{width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}
  .slot.empty{visibility:hidden}
  #shadow{position:absolute;inset:0;box-shadow:0 30px 70px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.4);border-radius:6px;pointer-events:none}
  #spine{position:absolute;left:50%;top:0;height:100%;width:8%;transform:translateX(-50%);pointer-events:none;z-index:4;
    background:linear-gradient(90deg,transparent,rgba(0,0,0,.22) 47%,rgba(0,0,0,.34) 50%,rgba(0,0,0,.22) 53%,transparent)}
  .leaf{z-index:3;display:none;transform-style:preserve-3d;will-change:transform}
  .leaf.fwd{left:50%;transform-origin:left center}
  .leaf.bwd{left:0;transform-origin:right center}
  .leaf.go{transition:transform var(--flip) cubic-bezier(.45,.05,.25,1)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;overflow:hidden}
  .face.back{transform:rotateY(180deg)}
  .face.empty{visibility:hidden}
  .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 60%)}
  /* 翻動時的明暗動畫在 iPad Safari 上容易造成殘影和閃爍，所以拿掉 */

  #bar{position:fixed;left:0;top:0;height:6px;width:100%;background:rgba(0,0,0,.08);z-index:8}
  #bar i{display:block;height:100%;width:0;background:var(--accent)}
  #ui{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;row-gap:10px;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(241,241,239,.92));transition:opacity .3s;
    opacity:0;pointer-events:none}                       /* 預設完全隱藏 */
  #ui.show{opacity:1;pointer-events:auto}
  /* 角落的小按鈕：點一下展開工具列，再點一下收起 */
  #more{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:9;min-width:0;width:56px;height:56px;padding:0;
    color:#fff;font-size:26px;line-height:1;opacity:.35;background:rgba(0,0,0,.45);transition:opacity .3s}
  #more:hover,#more.on{opacity:1}
  #count{min-width:130px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
  #msg{color:#fff;position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 18px;border-radius:999px;font-size:18px;opacity:0;transition:opacity .25s;z-index:9;pointer-events:none}
  #msg.show{opacity:1}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:22px;z-index:20;background:var(--bg)}
  #fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;z-index:7;transition:opacity .5s}

  /* 雙直式螢幕（視窗橫跨兩台，畫面接近正方形或直式） */
  #title{display:none;position:fixed;top:3.5vh;left:0;right:0;text-align:center;z-index:4;pointer-events:none}
  #title b{display:block;font-size:clamp(30px,3.6vw,76px);letter-spacing:.08em}
  #title small{display:block;margin-top:.4em;font-size:clamp(18px,1.8vw,38px);color:var(--muted)}
  @media (max-aspect-ratio: 5/4) and (min-width: 1400px){      /* 只有很寬的雙直式螢幕才用大尺寸，平板不會誤用 */
    #title{display:block}
    #reader button{height:76px;min-width:96px;padding:0 30px;font-size:28px}
    #count{font-size:28px;min-width:220px}
    #ui{gap:24px;padding-top:24px;padding-bottom:calc(5vh + env(safe-area-inset-bottom))}
    #bar{height:12px}
    #reader #more{width:84px;height:84px;min-width:0;padding:0;font-size:40px;right:3vw;bottom:3vh}
    #ptitle{font-size:34px}#toc button{height:64px;font-size:24px}
    #grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  }

  /* 目錄面板 */
  #panel{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;background:rgba(241,241,239,.97);backdrop-filter:blur(6px)}
  #panel.open{display:flex}
  #phead{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid rgba(0,0,0,.12)}
  #ptitle{flex:1;font-size:24px;font-weight:700}
  #pbody{flex:1;overflow:auto;padding:20px 24px 40px;-webkit-overflow-scrolling:touch}
  #toc{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
  #toc button{height:44px;font-size:17px;background:rgba(240,138,60,.25);white-space:pre}
  #toc button:hover{background:rgba(240,138,60,.5)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
  .th{position:relative;cursor:pointer;border-radius:6px;overflow:hidden;background:#fff;aspect-ratio:.708;outline:3px solid transparent}
  .th img{width:100%;height:100%;object-fit:fill;display:block}
  .th span{color:#fff;position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);font-size:13px;padding:2px 8px;border-radius:999px}
  .th.cur{outline-color:var(--accent)}
  .th:hover{outline-color:rgba(0,0,0,.35)}
  .th.cur:hover{outline-color:var(--accent)}
  #ptip{padding:0 24px 12px;color:var(--muted);font-size:15px}
</style>
</head>
<body>

<!-- ============ 書架 ============ -->
<div id="shelfView">
  <h1>電子書架</h1>
  <p class="sub">點選一本書開始閱讀，書頁會自動翻動</p>
  <div id="books"></div>
  <p class="tip">看書時：點左右翻頁、點中間暫停、☰ 目錄可跳頁、⌂ 書架可換別本書</p>
  <button id="sfull" aria-label="全螢幕">⛶ 全螢幕</button>
</div>

<!-- ============ 影片播放 ============ -->
<div id="videoView">
  <video id="vid" controls playsinline preload="metadata"></video>
  <button id="vback" aria-label="回到書架">⌂ 書架</button>
</div>

<!-- ============ 閱讀器（和書架在同一個網頁，切換時不換頁，所以不會退出全螢幕） ============ -->
<div id="reader">
  <div id="bar"><i id="fill"></i></div>
  <div id="wrap">
    <div id="book">
      <div id="shadow"></div>
      <div id="L" class="slot"><img alt=""></div>
      <div id="R" class="slot"><img alt=""></div>
      <div id="spine"></div>
      <div id="leaf" class="leaf">
        <div class="face front"><img alt=""></div>
        <div class="face back"><img alt=""></div>
      </div>
    </div>
  </div>
  <div id="title"><b></b><small></small></div>
  <div id="fade"></div>
  <div id="msg"></div>
  <div id="panel">
    <div id="phead">
      <div id="ptitle"></div>
      <button id="pclose" aria-label="關閉目錄">✕ 關閉</button>
    </div>
    <div id="ptip">點選章節或頁面縮圖，就會翻到那一頁</div>
    <div id="pbody">
      <div id="toc"></div>
      <div id="grid"></div>
    </div>
  </div>
  <button id="more" aria-label="顯示或隱藏工具列">⋯</button>
  <div id="ui">
    <button id="shelf" aria-label="回到書架">⌂ 書架</button>
    <button id="menu" aria-label="開啟目錄">☰ 目錄</button>
    <button id="prev" aria-label="上一頁">◀</button>
    <button id="play" aria-label="播放或暫停">❚❚ 暫停</button>
    <button id="next" aria-label="下一頁">▶</button>
    <span id="count"></span>
    <button id="full" aria-label="全螢幕">⛶</button>
  </div>
  <div id="err">圖片載入失敗，請確認 books 資料夾和 index.html 放在一起。</div>
</div>

<script src="books.js?v=20261123j"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  /* ===== 可調整的設定 ===== */
  var SECONDS = 3;            // 每次翻頁後停留秒數（也可用網址 ?sec=5 臨時改）
  var FLIP_MS = 1100;         // 翻頁動畫時間（要和 CSS --flip 一致）
  /* ======================== */
  var KIOSK = q.has('kiosk');   // 網址加 ?kiosk 進入展示模式：影片全螢幕循環播放、沒有返回鍵與控制列、被暫停會自動繼續
  if (KIOSK){
    document.documentElement.classList.add('kiosk');
    ['contextmenu','dragstart','selectstart'].forEach(function(t){ addEventListener(t, function(e){ e.preventDefault(); }); });
    addEventListener('keydown', function(e){ if (e.key !== 'F11' && e.key !== 'F5') e.preventDefault(); }, true);
  }
  if (q.get('sec')) SECONDS = Math.max(1, parseFloat(q.get('sec')) || SECONDS);
  if (q.get('flip')) FLIP_MS = Math.max(300, parseFloat(q.get('flip')) || FLIP_MS);   // ?flip=1500 可改翻頁速度
  document.documentElement.style.setProperty('--flip', FLIP_MS + 'ms');

  var $ = function(id){ return document.getElementById(id); };
  var BOOKS = window.BOOKS || [];
  var shelfView = $('shelfView'), reader = $('reader');
  var book = $('book'), L = $('L'), R = $('R'), leaf = $('leaf'),
      fill = $('fill'), count = $('count'), playBtn = $('play'),
      ui = $('ui'), msg = $('msg'), fadeEl = $('fade'), panel = $('panel');
  var Limg = L.querySelector('img'), Rimg = R.querySelector('img'),
      Fimg = leaf.querySelector('.front img'), Bimg = leaf.querySelector('.back img');
  var Fface = leaf.querySelector('.front'), Bface = leaf.querySelector('.back');

  // 目前這本書的狀態（開書時重設）
  var BOOK = null, TOTAL = 0, RATIO = 0.7, S = 1, SINGLE = false;
  var s = 0, busy = false, playing = true, active = false, gen = 0;
  var t0 = 0, pausedAt = 0, hideT = 0, idleT = 0;
  var modal = false, modalAt = 0, built = false;
  var keep = {}, keepOrder = [];

  /* ---------- 全螢幕（書架和閱讀器共用，同一個網頁所以切換不會退出） ---------- */
  function toggleFull(){
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement){ (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
    else if (el.requestFullscreen || el.webkitRequestFullscreen){ (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
    else { alert('這個瀏覽器不支援網頁全螢幕。\n\niPad：點 Safari 的「分享」→「加入主畫面」，之後從主畫面的圖示開啟，就是沒有網址列的全螢幕。'); }
  }
  // 已經是從主畫面開啟的全螢幕 App 時，不需要全螢幕按鈕
  if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches)){
    $('sfull').style.display = 'none'; $('full').style.display = 'none';
  }
  $('sfull').onclick = toggleFull;
  $('full').onclick = function(e){ e.stopPropagation(); toggleFull(); };

  /* ---------- 書架 ---------- */
  function renderShelf(){
    var box = $('books'); box.innerHTML = '';
    var W = innerWidth, H = innerHeight;
    function fac(b){ return b.type === 'video' ? (b.coverRatio ? b.coverRatio / .708 : 1.6) : (b.coverRatio || b.ratio) / .708; }   // 各項目寬度相對於「--w」的倍數（封面等高）
    var rowOf = function(b){ return b.row || 1; };
    var S1 = 1.35;   // 第一排（評鑑書）封面比第二排大的倍數
    var scaleOf = function(b){ return rowOf(b) === 1 ? S1 : 1; };
    var GAP = Math.round(Math.max(72, Math.min(0.05 * W, 130)));   // 第二排書與書的橫向間距
    box.style.columnGap = GAP + 'px'; box.style.rowGap = '56px';
    var rs = {};   // 每一排的寬度總和與本數
    BOOKS.forEach(function(b){ var r = rowOf(b); rs[r] = rs[r] || {f: 0, n: 0}; rs[r].f += fac(b) * scaleOf(b); rs[r].n++; });
    var maxW = Math.min(W - 48, 1600), fitW = 1e9;
    Object.keys(rs).forEach(function(r){ fitW = Math.min(fitW, (maxW - (rs[r].n - 1) * GAP - 4) / rs[r].f); });
    var w0 = Math.min(0.22 * W, 0.34 * H, 380);
    var nRows = Object.keys(rs).length;
    if (nRows > 1) w0 = Math.min(w0, Math.max(240, .708 * ((H - 330 - 340) / (1 + S1))));   // 兩排盡量一個畫面放下（最小仍保持夠大）
    box.style.setProperty('--w', Math.max(120, Math.min(w0, fitW)) + 'px');
    var lastRow = 1;
    BOOKS.forEach(function(b){
      if (rowOf(b) !== lastRow){ lastRow = rowOf(b); var br = document.createElement('span'); br.style.cssText = 'flex:0 0 100%;height:0;margin-top:-48px'; box.appendChild(br); }
      var it = document.createElement('a'); it.className = 'item'; it.href = '#' + encodeURIComponent(b.id);
      var isVid = b.type === 'video';
      it.innerHTML = '<div class="cover"><img alt="">' + (isVid ? '<i class="play"></i>' : '') + '</div><div class="name"></div><div class="desc"></div><span class="pages"></span><span class="go">' + (isVid ? '播放影片' : '開始閱讀') + '</span>';
      var cr = isVid ? (b.coverRatio || 16 / 9) : (b.coverRatio || b.ratio);
      it.querySelector('.cover').style.aspectRatio = cr; it.style.width = 'calc(var(--w) * ' + (fac(b) * scaleOf(b)) + ')';   // 每本書封面等高
      var im = it.querySelector('img'); im.src = (isVid ? (b.cover || b.poster) : (b.cover || ('books/' + b.id + '/pages/p001.jpg'))) + '?v=20261123c'; im.alt = b.title + ' 封面';
      if (rowOf(b) !== 1) it.querySelector('.go').style.display = 'none';   // 第二排四本：點書本身就能開始，不需要按鈕
      it.querySelector('.name').textContent = b.title;
      it.querySelector('.desc').textContent = b.subtitle || '';
      it.querySelector('.pages').textContent = isVid ? ('影片 ' + (b.duration || '')) : ('共 ' + b.pages + ' 頁');
      box.appendChild(it);
    });
  }
  (function(){ var S = window.SITE || {}; if (S.title){ document.querySelector('#shelfView h1').textContent = S.title; document.title = S.title; }
    if (typeof S.subtitle === 'string') document.querySelector('#shelfView .sub').textContent = S.subtitle; })();
  renderShelf();
  var rsT = 0; addEventListener('resize', function(){ clearTimeout(rsT); rsT = setTimeout(renderShelf, 150); });

  /* ---------- 路由：用網址 # 切換「書架 / 某一本書」，不會重新載入網頁 ---------- */
  function route(){
    var id = decodeURIComponent(location.hash.replace(/^#/, ''));
    var b = BOOKS.filter(function(x){ return x.id === id; })[0];
    if (KIOSK && !(b && b.type === 'video')){   // 展示模式：永遠回到影片，不讓人離開
      var kv = BOOKS.filter(function(x){ return x.type === 'video'; })[0];
      if (kv){ location.hash = '#' + encodeURIComponent(kv.id); return; }
    }
    if (b && b.type === 'video'){ if (active) closeBook(); openVideo(b); return; }
    closeVideo();
    if (b){ if (!active || !BOOK || BOOK.id !== b.id) openBook(b); }
    else if (active) closeBook();
  }
  var vv = $('videoView'), vid = $('vid'), videoOn = false;
  function openVideo(b){
    if (videoOn) return;
    videoOn = true;
    shelfView.style.display = 'none'; vv.style.display = 'block';
    vid.poster = b.poster || ''; vid.src = b.src;
    document.title = b.title;
    if (KIOSK){ vid.controls = false; $('vback').style.display = 'none'; document.body.classList.add('kiosk'); }
    vid.loop = (b.loop !== false);   // 輪播：播完自動從頭再播（books.js 該影片設 loop: false 可關閉）
    vid.muted = false;
    try { var p = vid.play(); if (p && p.catch) p.catch(function(){ vid.muted = true; try { vid.play(); } catch (e) {} }); } catch (e) {}   // 瀏覽器擋有聲自動播放時，改靜音照樣輪播
  }
  function closeVideo(){
    if (!videoOn) return;
    videoOn = false;
    try { vid.pause(); } catch (e) {}
    vid.removeAttribute('src'); try { vid.load(); } catch (e) {}
    vv.style.display = 'none'; shelfView.style.display = 'flex';
    document.title = (window.SITE && window.SITE.title) || '電子書架';
  }
  $('vback').onclick = function(){ location.hash = ''; };
  if (KIOSK){
    var kick = function(){ if (videoOn && vid.paused){ try { var p = vid.play(); if (p && p.catch) p.catch(function(){ vid.muted = true; try { vid.play(); } catch (e) {} }); } catch (e) {} } };
    vid.addEventListener('pause', function(){ setTimeout(kick, 300); });
    vid.addEventListener('ended', function(){ try { vid.currentTime = 0; } catch (e) {} kick(); });
    var fails = 0;
    vid.addEventListener('error', function(){ if (!videoOn) return; setTimeout(function(){ var s = vid.src; vid.src = ''; vid.src = s; kick(); }, Math.min(30000, 3000 * (++fails))); });
    vid.addEventListener('playing', function(){ fails = 0; });
    setInterval(kick, 5000);
    var wl = null; function keepAwake(){ try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ wl = l; }).catch(function(){}); } catch (e) {} }
    keepAwake(); document.addEventListener('visibilitychange', function(){ if (!document.hidden){ keepAwake(); kick(); } });
  }
  addEventListener('hashchange', route);

  /* ---------- 工具 ---------- */
  function pagesOf(k){
    if (SINGLE) return {l: 0, r: (k >= 0 && k < TOTAL) ? k + 1 : 0};   // 橫式（簡報）：一次一頁
    var l = (k >= 1 && 2 * k <= TOTAL) ? 2 * k : 0;
    var r = (2 * k + 1 <= TOTAL) ? 2 * k + 1 : 0;
    return {l: l, r: r};
  }
  function pad(p){ return String(p).padStart(3, '0'); }
  function src(p){ return 'books/' + BOOK.id + '/pages/p' + pad(p) + '.jpg'; }
  // 回傳 Promise：圖片解碼完成才算好，避免畫面上出現一格空白（閃爍）
  // 最多等 0.7 秒：萬一某台裝置的解碼一直沒回應，也不會讓整本書卡住
  function decoded(im){
    var p;
    try { p = im.decode ? im.decode().catch(function(){}) : Promise.resolve(); } catch (e) { p = Promise.resolve(); }
    return Promise.race([p, new Promise(function(r){ setTimeout(r, 700); })]);
  }
  function setImg(img, box, p){
    if (p){
      if (img.getAttribute('src') !== src(p)) img.src = src(p);
      box.classList.remove('empty');
      return decoded(img);
    }
    img.removeAttribute('src'); box.classList.add('empty');
    return Promise.resolve();
  }
  // 預先載入並解碼附近的頁面，留住最近 24 張
  function warm(n){
    if (!n) return Promise.resolve();
    if (!keep[n]){
      var im = new Image(); im.src = src(n); keep[n] = im; keepOrder.push(n);
      if (keepOrder.length > 24){ delete keep[keepOrder.shift()]; }
    }
    return decoded(keep[n]);
  }
  function preloadSpread(k){
    if (k < 0 || k >= S) return;
    var p = pagesOf(k); warm(p.l); warm(p.r);
  }
  // 封面只有右頁、封底只有左頁時，把書本平移，讓單頁置中
  function shiftFor(k){
    var p = pagesOf(k);
    if (SINGLE) return '-25%';
    if (!p.l && p.r) return '-25%';
    if (p.l && !p.r) return '25%';
    return '0';
  }
  function layout(){
    if (!BOOK) return;
    var W = innerWidth, H = innerHeight;
    var tall = W / H < 1.25 && W >= 1400;                  // 雙直式螢幕：上下要留空間給書名和按鈕
    var ph = Math.min(H * (tall ? 0.74 : 0.92), W * 0.98 / ((SINGLE ? 1 : 2) * RATIO));
    book.style.height = ph + 'px';
    book.style.width = (2 * ph * RATIO) + 'px';
  }
  function updateCount(){
    var p = pagesOf(s);
    var txt = p.l && p.r ? (p.l + '–' + p.r) : (p.l || p.r);
    count.textContent = '第 ' + txt + ' 頁 / ' + TOTAL;
    try { localStorage.setItem('spread-' + BOOK.id, s); } catch (e) {}
  }
  function toast(t){ msg.textContent = t; msg.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function(){ msg.classList.remove('show'); }, 900); }

  /* ---------- 開書 / 關書 ---------- */
  function openBook(b){
    gen++;
    BOOK = b; TOTAL = b.pages; RATIO = b.ratio; SINGLE = !!b.single; S = SINGLE ? TOTAL : Math.floor(TOTAL / 2) + 1;
    keep = {}; keepOrder = [];
    busy = false; playing = true; pausedAt = 0; modal = false; built = false;
    playBtn.textContent = '❚❚ 暫停';
    panel.classList.remove('open'); $('toc').innerHTML = ''; $('toc').style.display = ''; $('grid').innerHTML = '';
    leaf.style.display = 'none'; leaf.classList.remove('go'); fadeEl.style.opacity = 0; $('err').style.display = 'none';
    $('title').querySelector('b').textContent = b.title;
    $('title').querySelector('small').textContent = b.subtitle || '';
    document.title = b.title + '｜翻書輪播';
    shelfView.style.display = 'none'; reader.style.display = 'block'; active = true;
    layout();
    var start = 0;
    // 每次打開都從封面開始（不再記住上次看到哪一頁）
    book.style.transition = 'none'; renderStatic(start);
    void book.offsetWidth; book.style.transition = '';
    showUI(false); wake(); keepAwake();
  }
  function closeBook(){
    gen++; active = false; busy = false; closePanelQuiet(); showUI(false);
    reader.style.display = 'none'; shelfView.style.display = 'flex';
    clearTimeout(hideT); clearTimeout(idleT); document.body.classList.remove('idle');
    document.title = '電子書架';
  }

  function renderStatic(k){
    var p = pagesOf(k);
    var ready = Promise.all([setImg(Limg, L, p.l), setImg(Rimg, R, p.r)]);
    book.style.transform = 'translateX(' + shiftFor(k) + ')';
    s = k; updateCount();
    preloadSpread(k + 1); preloadSpread(k + 2); preloadSpread(k - 1);
    t0 = performance.now(); fill.style.width = '0';
    return ready;
  }

  // 等瀏覽器真的畫出 n 個畫面（避免在 Safari 上換圖和顯示葉片差一格造成閃爍）；背景分頁不畫圖時用計時器保底
  function frames(n){
    return new Promise(function(res){
      var c = 0;
      function step(){ if (++c >= n) res(); else requestAnimationFrame(step); }
      requestAnimationFrame(step);
      setTimeout(res, 120 * n);
    });
  }

  function flip(dir){
    if (busy || !active) return;
    var t = s + dir;
    if (t < 0 || t >= S){ return wrap(t < 0 ? S - 1 : 0); }
    busy = true; var g = gen;
    var cur = pagesOf(s), nxt = pagesOf(t);
    var underNext = dir > 0 ? nxt.r : nxt.l;           // 翻開後露出的那一頁
    // 1) 葉片還藏著的時候，先把它正反面的圖準備好（解碼完成）
    Promise.all([
      dir > 0 ? setImg(Fimg, Fface, cur.r) : setImg(Fimg, Fface, cur.l),
      dir > 0 ? setImg(Bimg, Bface, nxt.l) : setImg(Bimg, Bface, nxt.r),
      warm(underNext)
    ]).then(function(){
      if (g !== gen) return;
      // 2) 先顯示葉片（內容和底下一樣，看不出變化），等它真的畫出來，再換被蓋住的底層，最後才開始翻
      leaf.className = 'leaf ' + (dir > 0 ? 'fwd' : 'bwd');
      leaf.style.transform = 'rotateY(0deg)';
      leaf.style.display = 'block';
      frames(2).then(function(){
        if (g !== gen) return;
        return dir > 0 ? setImg(Rimg, R, nxt.r) : setImg(Limg, L, nxt.l);   // 此時被葉片完全蓋住
      }).then(function(){ return frames(2); }).then(function(){
        if (g !== gen) return;
        leaf.classList.add('go');
        leaf.style.transform = 'rotateY(' + (dir > 0 ? -180 : 180) + 'deg)';
        book.style.transform = 'translateX(' + shiftFor(t) + ')';
        setTimeout(function(){
          if (g !== gen) return;
          // 3) 葉片落地後，先把另一側底層換成新頁、等它解碼並畫出來，再收起葉片
          Promise.all([setImg(Limg, L, nxt.l), setImg(Rimg, R, nxt.r)]).then(function(){ return frames(2); }).then(function(){
            if (g !== gen) return;
            leaf.style.display = 'none'; leaf.classList.remove('go');
            s = t; updateCount(); busy = false;
            preloadSpread(t + 1); preloadSpread(t + 2); preloadSpread(t - 1);
            t0 = performance.now(); fill.style.width = '0';
          });
        }, FLIP_MS + 60);
      });
    });
  }
  function wrap(k){           // 首尾相接、或從目錄跳頁時用淡出淡入，避免倒翻很多頁
    if (busy) return; busy = true; var g = gen;
    fadeEl.style.opacity = 1;
    setTimeout(function(){
      if (g !== gen) return;
      renderStatic(k).then(function(){            // 新頁解碼好才淡入，避免閃一下
        if (g !== gen) return;
        fadeEl.style.opacity = 0;
        setTimeout(function(){ if (g !== gen) return; busy = false; t0 = performance.now(); }, 500);
      });
    }, 520);
  }

  function check(now){
    if (active && playing && !busy && !modal){
      var p = (now - t0) / (SECONDS * 1000);
      if (p >= 1) flip(1); else fill.style.width = (p * 100) + '%';
    }
  }
  function tick(now){ check(now); requestAnimationFrame(tick); }
  setInterval(function(){ check(performance.now()); }, 200);   // 備援：畫面計時被節流時，仍會自動翻頁
  function setPlaying(v){
    if (v === playing) return;
    playing = v;
    if (v){ t0 = performance.now() - pausedAt; }
    else { pausedAt = performance.now() - t0; }
    playBtn.textContent = v ? '❚❚ 暫停' : '▶ 播放';
    toast(v ? '播放中' : '已暫停'); wake();
  }
  function manual(d){ if (!active || modal) return; flip(d); wake(); }

  /* ---------- 目錄面板：章節 + 頁面縮圖，點選就跳頁 ---------- */
  function spreadOf(p){ return SINGLE ? Math.min(S - 1, p - 1) : Math.min(S - 1, Math.floor(p / 2)); }
  function buildPanel(){
    built = true;
    $('ptitle').textContent = BOOK.title + (BOOK.subtitle ? '　' + BOOK.subtitle : '');
    var toc = $('toc');
    (BOOK.toc || []).forEach(function(c){
      var b = document.createElement('button'); b.textContent = c.t;
      b.onclick = function(){ jump(c.p); }; toc.appendChild(b);
    });
    if (!(BOOK.toc || []).length) toc.style.display = 'none';
    var g = $('grid');
    for (var n = 1; n <= TOTAL; n++){
      (function(n){
        var d = document.createElement('div'); d.className = 'th'; d.dataset.p = n; d.style.aspectRatio = RATIO;
        var im = new Image(); im.loading = 'lazy'; im.alt = '第 ' + n + ' 頁';
        im.src = 'books/' + BOOK.id + '/thumbs/p' + pad(n) + '.jpg';
        var sp = document.createElement('span'); sp.textContent = n;
        d.appendChild(im); d.appendChild(sp);
        d.onclick = function(){ jump(n); };
        g.appendChild(d);
      })(n);
    }
  }
  function markCurrent(){
    var p = pagesOf(s);
    Array.prototype.forEach.call($('grid').children, function(el){
      var n = +el.dataset.p; el.classList.toggle('cur', n === p.l || n === p.r);
    });
  }
  function openPanel(){
    if (modal || !active) return;
    if (!built) buildPanel();
    modal = true; modalAt = performance.now();
    markCurrent(); panel.classList.add('open');
    var cur = $('grid').querySelector('.cur'); if (cur) cur.scrollIntoView({block:'center'});
  }
  function closePanel(){
    if (!modal) return;
    modal = false; t0 += performance.now() - modalAt;     // 開著目錄的時間不算進停留秒數
    panel.classList.remove('open');
  }
  function closePanelQuiet(){ modal = false; panel.classList.remove('open'); }
  function jump(p){ closePanel(); var k = spreadOf(p); if (k !== s) wrap(k); }

  $('menu').onclick = function(e){ e.stopPropagation(); openPanel(); };
  $('pclose').onclick = function(e){ e.stopPropagation(); closePanel(); };
  $('shelf').onclick = function(e){ e.stopPropagation(); location.hash = ''; };   // 回書架（不換頁）
  $('prev').onclick = function(e){ e.stopPropagation(); manual(-1); };
  $('next').onclick = function(e){ e.stopPropagation(); manual(1); };
  playBtn.onclick = function(e){ e.stopPropagation(); setPlaying(!playing); };

  // 點畫面左 1/4 上一頁、右 1/4 下一頁、中間暫停/播放；觸控可左右滑動
  var sx = 0, sy = 0;
  document.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; if (active) wake(); }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (!active || modal) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){ manual(dx < 0 ? 1 : -1); e.preventDefault(); }
  }, {passive:false});
  $('wrap').addEventListener('click', function(e){
    if (!active || modal) return;
    var x = e.clientX / innerWidth;
    if (x < .25) manual(-1); else if (x > .75) manual(1); else setPlaying(!playing);
  });
  document.addEventListener('keydown', function(e){
    if (!active){                              // 書架：數字鍵直接開書
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= BOOKS.length) location.hash = BOOKS[n - 1].id;
      else if (e.key === 'f' || e.key === 'F') toggleFull();
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'PageDown') manual(1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') manual(-1);
    else if (e.key === ' '){ e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'f' || e.key === 'F') toggleFull();
    else if (e.key === 't' || e.key === 'T' || e.key === 'm' || e.key === 'M') { modal ? closePanel() : openPanel(); }
    else if (e.key === 'Escape') closePanel();
    else if (e.key === 'b' || e.key === 'B') location.hash = '';
    else if (e.key === 'Home') { if (!busy) renderStatic(0); }
    wake();
  });

  // 工具列預設隱藏：點角落的 ⋯ 展開，再點收起；展開後 8 秒沒操作也會自動收起
  function showUI(v){
    ui.classList.toggle('show', v); $('more').classList.toggle('on', v);
    clearTimeout(hideT);
    if (v) hideT = setTimeout(function(){ showUI(false); }, 8000);
  }
  // 滑鼠游標 3 秒沒動就隱藏（大螢幕展示用）；工具列展開時有操作就重新計時
  function wake(){
    if (!active) return;
    document.body.classList.remove('idle');
    clearTimeout(idleT); idleT = setTimeout(function(){ document.body.classList.add('idle'); }, 3000);
    if (ui.classList.contains('show')) showUI(true);
  }
  $('more').onclick = function(e){ e.stopPropagation(); showUI(!ui.classList.contains('show')); };
  document.addEventListener('mousemove', wake);

  // 盡量讓螢幕不休眠
  function keepAwake(){ try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); } catch (e) {} }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && active) keepAwake(); });

  Limg.onerror = Rimg.onerror = function(){ if (active) $('err').style.display = 'flex'; };
  addEventListener('resize', layout);

  requestAnimationFrame(tick);
  route();                                    // 依網址決定一開始是書架還是某本書
})();
</script>
</body>
</html>
